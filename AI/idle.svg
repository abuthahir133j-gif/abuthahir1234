<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Soft Floor Shadow Gradient -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5CEE0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#DDE3EF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- White Glossy Head & Body Gradients -->
    <linearGradient id="headBodyGloss" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFE"/>
      <stop offset="70%" stop-color="#E1E7F2"/>
      <stop offset="100%" stop-color="#C7D1E3"/>
    </linearGradient>

    <!-- Side Rim Light Shadow (Left) -->
    <linearGradient id="leftRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAF0F9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Side Rim Light Shadow (Right) -->
    <linearGradient id="rightRimGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CDD6E7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Head Top Cap Gradient -->
    <linearGradient id="topCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E7F1"/>
      <stop offset="100%" stop-color="#B6C2D6"/>
    </linearGradient>

    <!-- Ear Joint Gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#D5DFEE"/>
      <stop offset="100%" stop-color="#B0BED5"/>
    </linearGradient>

    <!-- Visor Dark Screen Gradient -->
    <linearGradient id="visorBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2032"/>
      <stop offset="45%" stop-color="#071322"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>

    <!-- Visor Inner Soft Radial Glow -->
    <radialGradient id="visorRadialGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1B5B85" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#0B273E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030810" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Cyan Face Gradient -->
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9EFAFF"/>
      <stop offset="40%" stop-color="#4BE3FF"/>
      <stop offset="100%" stop-color="#00ADEE"/>
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow Filter for Head & Body -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0B1A30" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="300" cy="542" rx="85" ry="11" fill="url(#floorShadow)"/>

  <!-- AI BUDDY ROBOT GROUP -->
  <g id="robot" transform="translate(0, 10)">

    <!-- FLOATING ARMS (Side capsules) -->
    <!-- Left Arm -->
    <g id="left-arm" filter="url(#softShadow)">
      <path d="M 235 295 C 190 325 180 415 212 445 C 235 465 260 445 265 390 C 270 340 255 290 235 295 Z"
            fill="url(#headBodyGloss)"/>
      <!-- Left Arm Inner Shading -->
      <path d="M 235 295 C 210 320 200 395 212 445 C 200 425 195 350 235 295 Z"
            fill="#CAD3E3" opacity="0.5"/>
      <!-- Left Arm Specular Highlight -->
      <path d="M 240 300 C 255 330 258 380 252 420 C 256 380 258 330 240 300 Z"
            fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- Right Arm -->
    <g id="right-arm" filter="url(#softShadow)">
      <path d="M 365 295 C 410 325 420 415 388 445 C 365 465 340 445 335 390 C 330 340 345 290 365 295 Z"
            fill="url(#headBodyGloss)"/>
      <!-- Right Arm Inner Shading -->
      <path d="M 365 295 C 390 320 400 395 388 445 C 400 425 405 350 365 295 Z"
            fill="#CAD3E3" opacity="0.6"/>
      <!-- Right Arm Specular Highlight -->
      <path d="M 360 300 C 345 330 342 380 348 420 C 344 380 342 330 360 300 Z"
            fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- NECK JOINT -->
    <g id="neck">
      <ellipse cx="300" cy="272" rx="42" ry="18" fill="#B8C4D6"/>
      <ellipse cx="300" cy="270" rx="40" ry="16" fill="url(#headBodyGloss)"/>
    </g>

    <!-- TORSO / BODY -->
    <g id="body" filter="url(#softShadow)">
      <!-- Main Egg/Capsule Torso -->
      <path d="M 300 260 C 365 260 380 330 375 405 C 370 460 345 485 300 485 C 255 485 230 460 225 405 C 220 330 235 260 300 260 Z"
            fill="url(#headBodyGloss)"/>

      <!-- Body Side Shading (Right) -->
      <path d="M 300 260 C 365 260 380 330 375 405 C 370 460 345 485 300 485 C 340 480 365 440 365 380 C 365 315 345 265 300 260 Z"
            fill="#C0CCDE" opacity="0.55"/>

      <!-- Body Side Shading (Left) -->
      <path d="M 300 260 C 235 260 220 330 225 405 C 230 460 255 485 300 485 C 260 480 235 440 235 380 C 235 315 255 265 300 260 Z"
            fill="#EAF0F8" opacity="0.6"/>

      <!-- Glossy Highlight on Upper Chest (Left) -->
      <path d="M 255 285 C 275 270 300 268 310 270 C 290 275 270 290 250 325 C 248 305 250 292 255 285 Z"
            fill="#FFFFFF" opacity="0.8"/>

      <!-- Lower Torso Seam Line with Center Step Notch -->
      <path d="M 226 405 C 248 418 268 422 284 422 L 284 434 L 316 434 L 316 422 C 332 422 352 418 374 405"
            fill="none" stroke="#AFBDD1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 226 407 C 248 420 268 424 284 424 L 284 436 L 316 436 L 316 424 C 332 424 352 420 374 407"
            fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- HEAD GROUP -->
    <g id="head" filter="url(#softShadow)">
      <!-- Top Cap / Antenna Notch -->
      <path d="M 276 96 C 276 86 324 86 324 96 L 320 108 L 280 108 Z" fill="url(#topCapGrad)"/>
      <ellipse cx="300" cy="94" rx="22" ry="7" fill="#E7EDF7"/>

      <!-- Side Ears -->
      <!-- Left Ear -->
      <rect x="206" y="152" width="22" height="46" rx="11" fill="url(#earGrad)"/>
      <rect x="210" y="156" width="14" height="38" rx="7" fill="#B8C4D6" opacity="0.5"/>

      <!-- Right Ear -->
      <rect x="372" y="152" width="22" height="46" rx="11" fill="url(#earGrad)"/>
      <rect x="376" y="156" width="14" height="38" rx="7" fill="#A2B0C5" opacity="0.6"/>

      <!-- Outer Main Head Capsule -->
      <path d="M 300 96 C 385 96 405 130 405 178 C 405 230 375 260 300 260 C 225 260 195 230 195 178 C 195 130 215 96 300 96 Z"
            fill="url(#headBodyGloss)"/>

      <!-- Head Left Ambient Reflection -->
      <path d="M 300 96 C 225 96 195 130 195 178 C 195 230 225 260 300 260 C 240 254 207 222 207 178 C 207 134 240 102 300 96 Z"
            fill="url(#leftRimGrad)" opacity="0.9"/>

      <!-- Head Right Side Shadow -->
      <path d="M 300 96 C 375 96 405 130 405 178 C 405 230 375 260 300 260 C 360 254 393 222 393 178 C 393 134 360 102 300 96 Z"
            fill="url(#rightRimGrad)" opacity="0.9"/>

      <!-- Head Top Gloss Arc Highlight -->
      <path d="M 235 116 C 260 104 315 102 345 112 C 320 108 265 110 235 116 Z"
            fill="#FFFFFF" opacity="0.85"/>

      <!-- VISOR FACE SCREEN -->
      <!-- Visor Border Frame -->
      <rect x="222" y="126" width="156" height="104" rx="52" fill="#B0BDD1"/>
      <!-- Visor Screen Fill -->
      <rect x="224" y="128" width="152" height="100" rx="50" fill="url(#visorBgGrad)"/>
      <!-- Visor Inner Soft Radial Glow -->
      <rect x="224" y="128" width="152" height="100" rx="50" fill="url(#visorRadialGlow)"/>

      <!-- Visor Top Arc Reflection -->
      <path d="M 244 136 C 275 131 325 131 356 136 C 340 141 280 143 244 136 Z"
            fill="#FFFFFF" opacity="0.22"/>

      <!-- GLOWING CYAN EYES & SMILE -->
      <g id="face-features" filter="url(#neonGlow)">
        <!-- Left Eye: Solid Glowing Cyan Dome Arch -->
        <path d="M 252 176 L 284 176 A 16 15 0 0 0 252 176 Z" fill="url(#cyanGlowGrad)"/>

        <!-- Right Eye: Solid Glowing Cyan Dome Arch -->
        <path d="M 316 176 L 348 176 A 16 15 0 0 0 316 176 Z" fill="url(#cyanGlowGrad)"/>

        <!-- Mouth: Solid Glowing Cyan Semi-Circle Smile -->
        <path d="M 292 186 C 292 196 308 196 308 186 Z" fill="url(#cyanGlowGrad)"/>
      </g>
    </g>

  </g>
</svg>
