<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Tutor - Student Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-page-container">
        <!-- Floating Stars & Background Sparkles -->
        <div class="sparkle s1">✦</div>
        <div class="sparkle s2">✦</div>
        <div class="sparkle s3">✦</div>
        <div class="sparkle s4">✦</div>
        <div class="paper-plane">✈</div>
        <div class="cloud c1">💭</div>
        <div class="cloud c2">💭</div>

        <div class="login-content-wrapper">
            <!-- Left Branding & Mascot Section -->
    

            <!-- Right Login Card Section -->
            <div class="login-right">
                <div class="login-card">
                    <!-- Brand Logo -->
                    <div class="brand-logo">
                        <img src="Login/logo.png" alt="One Tutor Logo" class="brand-logo-img">
                    </div>

                    <!-- Card Titles -->
                    <h2 class="card-title">Student Login</h2>
                    <p class="card-subtitle">Enter your laboratory Roll Number to begin</p>

                    <!-- Authentication Form -->
                    <form id="auth-form" onsubmit="return false;">
                        <div class="form-group">
                            <label for="roll-number-input" class="form-label">Enter Roll Number</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    id="roll-number-input" 
                                    placeholder="e.g. STU-101" 
                                    autocomplete="off"
                                    autofocus
                                />
                            </div>
                        </div>

                        <button type="submit" id="login-submit-btn" class="continue-btn" disabled>
                            <span>Continue</span>
                            <span class="btn-arrow">›</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Separate Login Authentication Engine Script -->
    <script src="auth.js"></script>
</body>
</html>
