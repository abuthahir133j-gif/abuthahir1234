<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: file:; media-src 'self' blob: data: file:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; base-uri 'self'; form-action 'self'; object-src 'none';">
    <title>One Tutor - Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <style>
        body { background: #6366f1; }
    </style>
</head>
<body>

    <div class="login-page-container">
        <!-- Floating Stars & Background Sparkles -->
        <div class="sparkle s1">✦</div>
        <div class="sparkle s2">✦</div>
        <div class="sparkle s3">✦</div>
        <div class="sparkle s4">✦</div>
        <div class="paper-plane">✈</div>
        <div class="cloud c1">💭</div>
        <div class="cloud c2">💭</div>

        <div class="login-content-wrapper">
            <!-- Left Branding & Mascot Section -->
    

            <!-- Right Login Card Section -->
            <div class="login-right">
                <div class="login-card">
                    <!-- Brand Logo -->
                    <div class="brand-logo">
                        <img src="Login/logo.png" alt="One Tutor Logo" class="brand-logo-img">
                    </div>

                    <!-- Card Titles -->
                    <h2 class="card-title">Student Login</h2>
                    <p class="card-subtitle">Enter your LMS Login Code to begin</p>

                    <!-- Authentication Error Alert Banner -->
                    <div id="auth-error-banner" class="auth-error-banner hidden">
                        <span class="error-icon">⚠️</span>
                        <span id="auth-error-msg">Invalid LMS Code. Please check with your teacher.</span>
                    </div>

                    <!-- Authentication Form -->
                    <form id="auth-form" onsubmit="return false;">
                        <div class="form-group">
                            <label for="roll-number-input" class="form-label">Enter LMS Login Code</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    id="roll-number-input" 
                                    placeholder="e.g. ABU001" 
                                    autocomplete="off"
                                    autofocus
                                />
                            </div>
                        </div>

                        <button type="submit" id="login-submit-btn" class="continue-btn" disabled>
                            <span>Start Learning</span>
                            <span class="btn-arrow">›</span>
                        </button>
                    </form>

                    <!-- Authenticated ENTER Section -->
                    <div id="authenticated-enter-section" class="authenticated-enter-section hidden">
                        <div class="student-welcome-badge">
                            <span class="welcome-label">READY TO EXPLORE</span>
                            <h3 id="student-welcome-name" class="student-welcome-name">Adventurer</h3>
                            <p class="student-welcome-code" id="student-welcome-code">LMS: ABU001</p>
                        </div>
                        <button type="button" id="enter-world-btn" class="enter-world-btn">
                            <span class="enter-btn-glow"></span>
                            <span class="enter-btn-text">ENTER WORLD</span>
                            <span class="enter-btn-icon">✦</span>
                        </button>
                        <button type="button" id="switch-account-btn" class="switch-account-btn">
                            Switch Student Code
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Immersive Story Intro Cinematic Container -->
    <div id="story-cinematic-container" class="story-cinematic-container hidden" aria-hidden="true">
        <video 
            id="story-video" 
            class="story-video" 
            preload="auto" 
            playsinline
        ></video>
        <!-- Cinematic Curtain for Seamless Atmospheric Fade -->
        <div id="cinematic-curtain" class="cinematic-curtain"></div>
    </div>

    <!-- Separate Login Authentication Engine Script -->
    <script src="auth.js"></script>
</body>
</html>
